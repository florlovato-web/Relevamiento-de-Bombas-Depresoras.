<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a4f47">
<link rel="manifest" href="manifest.json">
<title>Relevamiento de Bombas Depresoras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#eef1ef; --panel:#ffffff; --ink:#12201d; --ink-dim:#5c6b66; --line:#d7ddd9;
  --teal:#0e6e63; --teal-dk:#0a4f47; --amber:#c1811f; --red:#b8432e; --gray:#7c8783;
  --font-h:'Space Grotesk',system-ui,sans-serif; --font-b:system-ui,-apple-system,sans-serif; --font-m:'IBM Plex Mono',monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}

:root:not([data-theme="ligth"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1513; --panel:#182420; --ink:#e9efec; --ink-dim:#93a09b; --line:#2a3733;
    --teal:#2fb2a3; --teal-dk:#1c8377; --amber:#e0a349; --red:#e0685133; --gray:#5f6d68;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#182420; --ink:#e9efec; --ink-dim:#93a09b; --line:#2a3733;
  --teal:#2fb2a3; --teal-dk:#1c8377; --amber:#e0a349; --gray:#5f6d68;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);height:100%;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;background:var(--teal-dk);color:#fff}
header h1{font-family:var(--font-h);font-size:19px;margin:0 0 2px;letter-spacing:.2px}
header p{margin:0;font-size:12.5px;color:#cfe6e1;font-family:var(--font-m)}
.tabs{display:flex;gap:2px;padding:10px 16px 0;background:var(--teal-dk)}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:10px 10px 0 0;font-size:13.5px;font-weight:600;color:#cfe6e1;cursor:pointer;background:transparent;border:none;font-family:var(--font-b)}
.tab.active{background:var(--bg);color:var(--teal-dk)}
main{flex:1;overflow-y:auto;padding:12px 12px 90px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.count{font-size:12px;color:var(--ink-dim);margin:0 2px 10px;font-family:var(--font-m)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer;border-left:5px solid var(--gray)}
.card.si{border-left-color:var(--teal)}
.card.no{border-left-color:var(--red,#b8432e)}
.card.nspc{border-left-color:var(--amber)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-top b{font-family:var(--font-h);font-size:17px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;font-family:var(--font-m);text-transform:uppercase;letter-spacing:.3px}
.tag.si{background:#0e6e6322;color:var(--teal)}
.tag.no{background:#b8432e22;color:#b8432e}
.tag.nspc{background:#c1811f22;color:var(--amber)}
.card-sub{font-size:12.5px;color:var(--ink-dim);margin-top:5px;display:flex;flex-wrap:wrap;gap:8px}
.card-obs{font-size:12.5px;color:var(--ink-dim);margin-top:6px;line-height:1.4}
.empty{text-align:center;color:var(--ink-dim);padding:40px 20px;font-size:14px}
.fab{position:fixed;right:calc(16px + (100vw - 640px)/2);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--teal);color:#fff;border:none;font-size:28px;box-shadow:0 6px 18px #0e6e6355;cursor:pointer;z-index:25}
@media (max-width:670px){.fab{right:18px}}
.sheet-bg{position:fixed;inset:0;background:#00000066;z-index:40;display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--panel);border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:41;transform:translateY(100%);transition:transform .25s ease}
.sheet.show{transform:translateY(0)}
.sheet h2{font-family:var(--font-h);font-size:18px;margin:4px 0 14px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:7px;text-transform:uppercase;letter-spacing:.3px;font-family:var(--font-m)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;padding:11px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--teal);border-color:var(--teal);color:#fff}
input[type=text],textarea{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-family:var(--font-b)}
textarea{min-height:70px;resize:vertical}
.row2{display:flex;gap:10px}
.row2>div{flex:1}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-b)}
.btn.primary{background:var(--teal);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink-dim);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:#b8432e}
.summary-grid{display:flex;flex-direction:column;gap:18px}
.pct-block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.pct-line{display:flex;align-items:baseline;gap:6px;margin-bottom:9px}
.pct-line:last-child{margin-bottom:0}
.pct-line b{font-family:var(--font-h);font-size:12.5px;flex:0 0 78px}
.pct-items{display:flex;flex-wrap:wrap;gap:6px}
.pct-item{font-size:11.5px;padding:4px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-dim);font-family:var(--font-m)}
.pct-item b{font-family:var(--font-m);color:var(--ink)}
.list-tools{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;gap:8px;flex-wrap:wrap}
.pdf-all{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1.5px solid var(--teal);background:transparent;color:var(--teal);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-b)}
.sel-toggle{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink-dim);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-b)}
.sel-toggle.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.card-check{width:21px;height:21px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;margin-right:9px;color:#fff;font-size:13px;font-weight:900}
.card-check.on{background:var(--teal);border-color:var(--teal)}
.card.selecting{cursor:pointer}
.select-bar{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:30;box-shadow:0 -4px 16px #0002}
.card-actions{margin-top:8px;text-align:right}
.pdf-mini{background:transparent;border:none;color:var(--teal);font-size:11.5px;font-weight:700;cursor:pointer;padding:4px 0;font-family:var(--font-m)}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.chartbox h3{font-family:var(--font-h);font-size:14.5px;margin:0 0 10px}
.chart-wrap{position:relative;height:230px;width:100%}
canvas{display:block}
.stat-row{display:flex;gap:8px;margin-bottom:16px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--font-h);font-size:20px}
.stat span{font-size:10.5px;color:var(--ink-dim);text-transform:uppercase;font-family:var(--font-m)}
.banner{font-size:12px;color:var(--ink-dim);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;margin-bottom:12px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Bombas Depresoras</h1>
    <p id="subtitle">cargando…</p>
    <div class="tabs">
      <button class="tab active" data-tab="lista">Lista</button>
      <button class="tab" data-tab="resumen">Resumen</button>
    </div>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab">+</button>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>

<script>
const TRI=[['si','Sí'],['no','No'],['nspc','No se pudo constatar']];
const BI=[['si','Sí'],['no','No']];
const FIELDS=[
  {k:'esta',label:'¿La bomba está?',opts:TRI},
  {k:'funciona',label:'¿Funciona?',opts:TRI},
  {k:'medidor',label:'Tiene medidor',opts:BI},
  {k:'corriente',label:'Tiene corriente (alimentación)',opts:BI},
  {k:'clandestina',label:'Conexión clandestina',opts:BI},
  {k:'tableroCorriente',label:'Tablero tiene corriente',opts:BI},
];
const SEED=[
{numero:'427',esta:'si',funciona:'si',medidor:'si',corriente:'si',clandestina:'',tableroCorriente:'si',lectura:'1.09',obs:''},
{numero:'426',esta:'si',funciona:'si',medidor:'si',corriente:'si',clandestina:'',tableroCorriente:'si',lectura:'-0.17',obs:'Aparenta falla de tensión; funciona pero la tensión es irregular y corta sola.'},
{numero:'428',esta:'nspc',funciona:'no',medidor:'si',corriente:'no',clandestina:'',tableroCorriente:'no',lectura:'',obs:'No se encontró tapa de inspección; del tablero no bajan cables ni sensores. Todo indica que no está. (Tablero completo)'},
{numero:'429',esta:'nspc',funciona:'',medidor:'si',corriente:'no',clandestina:'',tableroCorriente:'',lectura:'',obs:'Tapa soldada. Medidor sin instalación. No hay tablero.'},
{numero:'431',esta:'si',funciona:'si',medidor:'si',corriente:'si',clandestina:'',tableroCorriente:'si',lectura:'',obs:'Térmica baja, se reactivó y quedó funcionando.'},
{numero:'432',esta:'si',funciona:'nspc',medidor:'si',corriente:'no',clandestina:'',tableroCorriente:'no',lectura:'',obs:'Sin corriente por parte de la empresa. Instalación completa, aparentemente correcta. (Tablero completo)'},
{numero:'433',esta:'nspc',funciona:'nspc',medidor:'si',corriente:'no',clandestina:'',tableroCorriente:'no',lectura:'',obs:'Tapa tapada de tierra, no se pudo observar la instalación. (Completo sin corriente)'},
{numero:'434',esta:'nspc',funciona:'',medidor:'',corriente:'',clandestina:'',tableroCorriente:'',lectura:'',obs:'No hay ninguna instalación visible en el punto geolocalizado.'},
{numero:'435',esta:'si',funciona:'si',medidor:'si',corriente:'si',clandestina:'',tableroCorriente:'no',lectura:'',obs:'Sin tablero. Caja con pulsador de arranque que funciona.'},
{numero:'436',esta:'nspc',funciona:'nspc',medidor:'si',corriente:'si',clandestina:'',tableroCorriente:'si',lectura:'',obs:'Tablero de accionamiento en cortocircuito. No se pudo observar cámara de inspección.'},
{numero:'(revisar N°, ilegible)',esta:'nspc',funciona:'no',medidor:'no',corriente:'',clandestina:'si',tableroCorriente:'si',lectura:'',obs:'REVISAR NÚMERO al editar. Tablero en corto. Vecino indica que la bomba está pero los caños están tapados.'},
{numero:'575',esta:'si',funciona:'si',medidor:'si',corriente:'si',clandestina:'',tableroCorriente:'si',lectura:'1.30',obs:''},
{numero:'572',esta:'si',funciona:'si',medidor:'si',corriente:'si',clandestina:'',tableroCorriente:'si',lectura:'',obs:'No presenta nivel suficiente para activar sola.'},
{numero:'571',esta:'no',funciona:'',medidor:'si',corriente:'no',clandestina:'',tableroCorriente:'no',lectura:'',obs:'Cámara de inspección vacía. Tablero incompleto.'},
{numero:'568',esta:'no',funciona:'',medidor:'si',corriente:'no',clandestina:'',tableroCorriente:'no',lectura:'',obs:'Tablero completo, cámara de inspección vacía.'},
{numero:'569',esta:'no',funciona:'',medidor:'',corriente:'',clandestina:'',tableroCorriente:'',lectura:'',obs:'No hay instalación en el punto.'},
{numero:'570',esta:'no',funciona:'',medidor:'no',corriente:'',clandestina:'',tableroCorriente:'no',lectura:'',obs:'Cámara de inspección con caños desconectados. Conexión cortada.'},
{numero:'567',esta:'no',funciona:'',medidor:'no',corriente:'no',clandestina:'',tableroCorriente:'no',lectura:'',obs:'Cámara llena de basura, sin tablero.'},
{numero:'565',esta:'si',funciona:'si',medidor:'no',corriente:'',clandestina:'si',tableroCorriente:'',lectura:'1.32',obs:'Llave de paso cerrada. Problema de tensión pero funciona (sin protección).'},
{numero:'564',esta:'si',funciona:'no',medidor:'si',corriente:'si',clandestina:'',tableroCorriente:'si',lectura:'',obs:'Posible falta de tensión. Vecino indica que hace 3 años no funciona y nadie vino a revisar.'},
{numero:'542',esta:'no',funciona:'',medidor:'',corriente:'',clandestina:'',tableroCorriente:'',lectura:'',obs:'No se encontró instalación en el punto.'},
{numero:'561',esta:'no',funciona:'',medidor:'',corriente:'',clandestina:'',tableroCorriente:'',lectura:'',obs:'No se encontró instalación en el punto.'},
{numero:'566',esta:'no',funciona:'',medidor:'no',corriente:'si',clandestina:'si',tableroCorriente:'si',lectura:'',obs:'No hay ninguna instalación en la cámara.'},
{numero:'563',esta:'no',funciona:'',medidor:'',corriente:'',clandestina:'',tableroCorriente:'',lectura:'',obs:'No hay instalación en el punto. REVISAR N° (letra poco clara).'}
];

const firebaseConfig = {
  apiKey: "AIzaSyAXkrpVaqzXCVwkuD4G6rPDlBTc9iNFDOk",
  authDomain: "relevamiento-de-bombas.firebaseapp.com",
  projectId: "relevamiento-de-bombas",
  storageBucket: "relevamiento-de-bombas.firebasestorage.app",
  messagingSenderId: "808522451621",
  appId: "1:808522451621:web:724e965fedb8be9f9a9b4c"
};

let items=[]; let usingDb=false; let dbCol=null;
let filters={esta:'todas',funciona:'todas'};
let tab='lista'; let editingId=null;
let selectMode=false; let selected=new Set();
function genUid(){ return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
let chartSumEsta=null, chartSumFunciona=null;
const COLORS=['#0e6e63','#b8432e','#c1811f'];

function label(k,v){ if(!v) return '—'; const f=FIELDS.find(f=>f.k===k); const o=f.opts.find(o=>o[0]===v); return o?o[1]:v; }

async function initStore(){
  try{
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    dbCol = db.collection('bombas');
    usingDb=true;
    const snap = await dbCol.get();
    if(snap.docs.length===0){ for(const s of SEED){ await dbCol.add(s); } }
    dbCol.onSnapshot(snap=>{
      items = snap.docs.map(d=>({id:d.id,...d.data()}));
      render();
    }, ()=>{ localFallback(); });
  } catch(e){
    console.error('No se pudo conectar a Firebase, usando respaldo local:', e);
    localFallback();
  }
}
function localFallback(){
  usingDb=false;
  let raw;
  try{ raw = JSON.parse(localStorage.getItem('bombas_data')||'null'); }catch(e){ raw=null; }
  if(!raw){ raw = SEED.map((s,i)=>({id:'s'+i,...s})); saveLocal(raw); }
  items = raw; render();
}
function saveLocal(arr){ try{ localStorage.setItem('bombas_data', JSON.stringify(arr)); }catch(e){} }

async function addItem(obj){
  if(!obj.uid) obj.uid = genUid();
  if(usingDb){ await dbCol.add(obj); }
  else{ items.push({id:'l'+Date.now()+Math.random().toString(36).slice(2,6), ...obj}); saveLocal(items); render(); }
}
async function updateItem(id,obj){
  if(usingDb){ await dbCol.doc(id).update(obj); }
  else{ const i=items.findIndex(x=>x.id===id); if(i>-1){ items[i]={...items[i],...obj}; saveLocal(items); render(); } }
}
async function removeItem(id){
  if(usingDb){ await dbCol.doc(id).delete(); }
  else{ items=items.filter(x=>x.id!==id); saveLocal(items); render(); }
}

function filtered(){
  return items.filter(it=>{
    if(filters.esta!=='todas' && it.esta!==filters.esta) return false;
    if(filters.funciona!=='todas' && it.funciona!==filters.funciona) return false;
    return true;
  }).sort((a,b)=> (a.numero||'').localeCompare(b.numero||'', undefined, {numeric:true}));
}

function render(){
  document.getElementById('subtitle').textContent = items.length+' bombas relevadas'+(usingDb?'':' · guardado en este dispositivo');
  if(tab==='lista') renderLista(); else renderResumen();
}

function counts(list,key){
  return {si:list.filter(i=>i[key]==='si').length, no:list.filter(i=>i[key]==='no').length, nspc:list.filter(i=>i[key]==='nspc').length};
}
function pctBlockHtml(list){
  const total=list.length;
  const pct=(n)=> total? Math.round(n/total*100):0;
  const ce=counts(list,'esta'), cf=counts(list,'funciona');
  const row=(title,c,labels)=>`
    <div class="pct-line"><b>${title}</b><div class="pct-items">
      <span class="pct-item">${labels[0]}: <b>${c.si}</b> (${pct(c.si)}%)</span>
      <span class="pct-item">${labels[1]}: <b>${c.no}</b> (${pct(c.no)}%)</span>
      <span class="pct-item">${labels[2]}: <b>${c.nspc}</b> (${pct(c.nspc)}%)</span>
    </div></div>`;
  return `<div class="pct-block">
    ${row('¿Está?', ce, ['Está','No está','No constatado'])}
    ${row('¿Funciona?', cf, ['Funciona','No funciona','No constatado'])}
  </div>`;
}
function renderLista(){
  const list=filtered();
  const main=document.getElementById('main');
  main.innerHTML = `
    <div class="filters" id="fEsta"></div>
    <div class="filters" id="fFunciona"></div>
    ${pctBlockHtml(list)}
    <div class="list-tools">
      <div class="count">${list.length} de ${items.length} bombas</div>
      <button class="sel-toggle ${selectMode?'on':''}" id="btnSelToggle">${selectMode?'✕ Cancelar selección':'☑ Seleccionar'}</button>
      <button class="pdf-all" id="btnPdfAll">⬇ PDF (${list.length})</button>
    </div>
    <div id="cards"></div>
  `;
  chipsRow('fEsta','esta',[['todas','Todas'],['si','Está'],['no','No está'],['nspc','No constatado']]);
  chipsRow('fFunciona','funciona',[['todas','Todas'],['si','Funciona'],['no','No funciona'],['nspc','No constatado']]);
  document.getElementById('btnPdfAll').addEventListener('click', ()=>downloadPdfList(list));
  document.getElementById('btnSelToggle').addEventListener('click', ()=>{ selectMode=!selectMode; selected.clear(); renderLista(); });
  const cards=document.getElementById('cards');
  if(list.length===0){ cards.innerHTML='<div class="empty">No hay bombas con estos filtros.</div>'; renderSelectBar(); return; }
  cards.innerHTML = list.map(it=>`
    <div class="card ${it.funciona||it.esta} ${selectMode?'selecting':''}" data-id="${it.id}">
      <div class="card-top">${selectMode?`<span class="card-check ${selected.has(it.id)?'on':''}">${selected.has(it.id)?'✓':''}</span>`:''}<b>N° ${it.numero||'s/n'}</b><span class="tag ${it.esta}">${label('esta',it.esta)}</span></div>
      <div class="card-sub">
        <span>Funciona: <b>${label('funciona',it.funciona)}</b></span>
        ${it.lectura?`<span>${it.lectura} mA</span>`:''}
        ${it.clandestina==='si'?'<span>⚠ Conexión clandestina</span>':''}
      </div>
      ${it.obs?`<div class="card-obs">${escapeHtml(it.obs)}</div>`:''}
      ${selectMode?'':`<div class="card-actions"><button class="pdf-mini" data-pdf="${it.id}">⬇ Descargar planilla PDF</button></div>`}
    </div>`).join('');
  cards.querySelectorAll('.card').forEach(c=>c.addEventListener('click',(e)=>{
    if(selectMode){ const id=c.dataset.id; selected.has(id)?selected.delete(id):selected.add(id); renderLista(); return; }
    if(e.target.closest('.pdf-mini')) return;
    openSheet(c.dataset.id);
  }));
  cards.querySelectorAll('.pdf-mini').forEach(b=>b.addEventListener('click',(e)=>{ e.stopPropagation(); const it=items.find(x=>x.id===b.dataset.pdf); downloadPdfSingle(it); }));
  renderSelectBar();
}
function renderSelectBar(){
  const old=document.getElementById('selBar'); if(old) old.remove();
  if(!selectMode) return;
  const bar=document.createElement('div');
  bar.className='select-bar'; bar.id='selBar';
  bar.innerHTML = `
    <button class="btn ghost" id="btnSelCancel">Cancelar</button>
    <button class="btn primary" id="btnSelExport">⬇ Exportar selección (${selected.size})</button>`;
  document.body.appendChild(bar);
  document.getElementById('btnSelCancel').addEventListener('click', ()=>{ selectMode=false; selected.clear(); renderLista(); });
  document.getElementById('btnSelExport').addEventListener('click', async ()=>{
    if(selected.size===0){ alert('Elegí al menos una bomba tocándola.'); return; }
    await exportItems(items.filter(it=>selected.has(it.id)), `bombas_seleccion_${new Date().toISOString().slice(0,10)}.json`);
    selectMode=false; selected.clear(); renderLista();
  });
}
function chipsRow(elId,key,opts){
  const el=document.getElementById(elId);
  el.innerHTML = opts.map(([v,l])=>`<button class="chip ${filters[key]===v?'on':''}" data-v="${v}">${l}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{ filters[key]=b.dataset.v; renderLista(); }));
}
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderResumen(){
  const main=document.getElementById('main');
  const n=items.length;
  const funciona=items.filter(i=>i.funciona==='si').length;
  const clandestina=items.filter(i=>i.clandestina==='si').length;
  main.innerHTML = `
    <div class="stat-row">
      <div class="stat"><b>${n}</b><span>Total</span></div>
      <div class="stat"><b>${funciona}</b><span>Funcionan</span></div>
      <div class="stat"><b>${clandestina}</b><span>Clandestinas</span></div>
    </div>
    <div class="summary-grid" id="chartsArea">
      <div class="chartbox"><h3>¿La bomba está?</h3><div class="chart-wrap"><canvas id="chEsta"></canvas></div></div>
      <div class="chartbox"><h3>¿Funciona?</h3><div class="chart-wrap"><canvas id="chFunciona"></canvas></div></div>
    </div>
    <div class="chartbox" style="margin-top:14px" id="shareBox">
      <h3>Compartir datos con un compañero</h3>
      <p style="font-size:12px;color:var(--ink-dim);margin:0 0 12px;line-height:1.5">Si tu compañero usa el plan gratis, lo que carga queda solo en su teléfono. Que toque "Exportar mis datos" y te mande el archivo por WhatsApp; vos lo abrís acá con "Importar recibidos" y se suma a esta lista.</p>
      <div class="sheet-actions">
        <button class="btn ghost" id="btnExport">⬇ Exportar mis datos</button>
        <label class="btn primary" for="fileImport" style="display:flex;align-items:center;justify-content:center;margin:0">⬆ Importar recibidos</label>
        <input type="file" id="fileImport" accept="application/json" style="display:none">
      </div>
    </div>`;
  document.getElementById('btnExport').addEventListener('click', exportData);
  document.getElementById('fileImport').addEventListener('change', (e)=>importData(e.target.files));
  renderResumenCharts(0);
}
function renderResumenCharts(attempt){
  const cvEsta=document.getElementById('chEsta'), cvFunciona=document.getElementById('chFunciona');
  if(!cvEsta || !cvFunciona) return;
  if(typeof Chart==='undefined'){
    if(attempt<15){ setTimeout(()=>renderResumenCharts(attempt+1), 300); return; }
    document.getElementById('chartsArea').innerHTML='<div class="banner">No se pudieron cargar los gráficos (la librería no respondió). Los porcentajes siguen disponibles en la pestaña Lista.</div>';
    return;
  }
  const ce=counts(items,'esta'), cf=counts(items,'funciona');
  if(chartSumEsta) chartSumEsta.destroy();
  if(chartSumFunciona) chartSumFunciona.destroy();
  const w1=Math.max(220, cvEsta.parentElement.clientWidth), w2=Math.max(220, cvFunciona.parentElement.clientWidth);
  cvEsta.width=w1; cvEsta.height=220; cvFunciona.width=w2; cvFunciona.height=220;
  chartSumEsta = new Chart(cvEsta, {type:'pie',data:{labels:['Está','No está','No constatado'],datasets:[{data:[ce.si,ce.no,ce.nspc],backgroundColor:COLORS}]},options:{responsive:false,plugins:{legend:{position:'bottom'}}}});
  chartSumFunciona = new Chart(cvFunciona, {type:'pie',data:{labels:['Funciona','No funciona','No constatado'],datasets:[{data:[cf.si,cf.no,cf.nspc],backgroundColor:COLORS}]},options:{responsive:false,plugins:{legend:{position:'bottom'}}}});
}
async function exportItems(list, filename){
  const data = list.map(({id,...rest})=>{ if(!rest.uid) rest.uid=genUid(); return rest; });
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  await saveFile(filename, blob);
}
async function exportData(){
  await exportItems(items, `bombas_export_${new Date().toISOString().slice(0,10)}.json`);
}
async function importData(fileList){
  if(!fileList || !fileList.length) return;
  let data;
  try{ data = JSON.parse(await fileList[0].text()); }catch(e){ alert('El archivo no es válido.'); return; }
  if(!Array.isArray(data)){ alert('El archivo no tiene el formato esperado.'); return; }
  let added=0, skipped=0;
  for(const raw of data){
    const numero=(raw.numero||'').trim();
    const yaExiste = (raw.uid && items.some(it=>it.uid===raw.uid)) || (numero && items.some(it=>(it.numero||'').trim()===numero));
    if(yaExiste){ skipped++; continue; }
    await addItem({uid:raw.uid||genUid(),numero:raw.numero||'',esta:raw.esta||'',funciona:raw.funciona||'',medidor:raw.medidor||'',corriente:raw.corriente||'',clandestina:raw.clandestina||'',tableroCorriente:raw.tableroCorriente||'',lectura:raw.lectura||'',obs:raw.obs||''});
    added++;
  }
  alert(`Se importaron ${added} bombas nuevas. ${skipped} ya existían (mismo número o mismo registro) y se omitieron.`);
}

function triRow(doc, L, y, W, labels, keys, value){
  const h=9, gW=W/3;
  labels.forEach((lbl,i)=>{
    const x=L+i*gW; const selected=keys[i]===value;
    doc.setDrawColor(0);
    if(selected){ doc.setFillColor(14,110,99); doc.rect(x,y,gW,h,'FD'); doc.setTextColor(255); doc.setFont('helvetica','bold'); }
    else { doc.setFillColor(255); doc.rect(x,y,gW,h,'S'); doc.setTextColor(0); doc.setFont('helvetica','normal'); }
    doc.setFontSize(8.5); doc.text(lbl, x+gW/2, y+h/2+1.6, {align:'center'});
  });
  doc.setTextColor(0);
  return y+h+1.5;
}
function biRow(doc, L, y, W, sectionLabel, fieldLabel, value, field2Label, value2){
  const h=9, secW=25, fieldW=45, boxW=14; let x=L;
  doc.setDrawColor(0); doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.setFillColor(255); doc.rect(x,y,secW,h,'S'); if(sectionLabel) doc.text(sectionLabel,x+2,y+h/2+1.6);
  x+=secW;
  doc.rect(x,y,fieldW,h,'S'); doc.setFont('helvetica','normal'); doc.text(fieldLabel,x+2,y+h/2+1.6);
  x+=fieldW;
  ['SI','NO'].forEach(opt=>{
    const selected=value===(opt==='SI'?'si':'no');
    doc.setDrawColor(0);
    if(selected){ doc.setFillColor(14,110,99); doc.rect(x,y,boxW,h,'FD'); doc.setTextColor(255); doc.setFont('helvetica','bold'); }
    else { doc.rect(x,y,boxW,h,'S'); doc.setTextColor(0); doc.setFont('helvetica','normal'); }
    doc.setFontSize(8.5); doc.text(opt,x+boxW/2,y+h/2+1.6,{align:'center'}); x+=boxW;
  });
  doc.setTextColor(0);
  if(field2Label){
    const rem=L+W-x, f2w=rem-boxW*2;
    doc.setDrawColor(0); doc.setFont('helvetica','normal'); doc.setFontSize(7.2);
    doc.rect(x,y,f2w,h,'S'); doc.text(field2Label,x+2,y+h/2+1.6); x+=f2w;
    ['SI','NO'].forEach(opt=>{
      const selected=value2===(opt==='SI'?'si':'no');
      if(selected){ doc.setFillColor(14,110,99); doc.rect(x,y,boxW,h,'FD'); doc.setTextColor(255); doc.setFont('helvetica','bold'); }
      else { doc.rect(x,y,boxW,h,'S'); doc.setTextColor(0); doc.setFont('helvetica','normal'); }
      doc.setFontSize(8.5); doc.text(opt,x+boxW/2,y+h/2+1.6,{align:'center'}); x+=boxW;
    });
  } else {
    const rem=L+W-x; if(rem>0){ doc.setDrawColor(0); doc.rect(x,y,rem,h,'S'); }
  }
  doc.setTextColor(0);
  return y+h;
}
function valueRow(doc, L, y, W, fieldLabel, valueText){
  const h=9, secW=25, fieldW=45; let x=L;
  doc.setDrawColor(0); doc.rect(x,y,secW,h,'S'); x+=secW;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.rect(x,y,fieldW,h,'S'); doc.text(fieldLabel,x+2,y+h/2+1.6); x+=fieldW;
  const rem=L+W-x; doc.rect(x,y,rem,h,'S');
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
  doc.text(valueText, x+rem/2, y+h/2+1.6, {align:'center'});
  return y+h;
}
function drawBombaPage(doc, it){
  const L=15, R=195, W=180;
  doc.setFillColor(228,230,229); doc.rect(L,12,88,13,'F');
  doc.setTextColor(40); doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.text('MINISTERIO DE INFRAESTRUCTURA', L+3, 17.5);
  doc.text('Y SERVICIOS PÚBLICOS', L+3, 21.5);
  doc.setTextColor(90); doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('GOBIERNO DE LA PROVINCIA DE', R, 16.5, {align:'right'});
  doc.setTextColor(20); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('BUENOS AIRES', R, 23, {align:'right'});
  doc.setTextColor(0); doc.setDrawColor(180); doc.line(L,28,R,28);

  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  doc.text('INSPECCIÓN DE BOMBAS DEPRESORAS', L, 35);
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('BOMBA N° '+(it.numero||'S/N'), 105, 45, {align:'center'});

  let y=52;
  y = triRow(doc, L, y, W, ['ESTÁ','NO ESTÁ','NO SE PUDO CONSTATAR'], ['si','no','nspc'], it.esta);
  y = triRow(doc, L, y, W, ['FUNCIONA','NO FUNCIONA','NO SE PUDO CONSTATAR'], ['si','no','nspc'], it.funciona);
  y += 5;
  y = biRow(doc, L, y, W, 'ALIMENT.', 'Tiene medidor', it.medidor);
  y = biRow(doc, L, y, W, '', 'Tiene corriente', it.corriente, 'CONEXIÓN CLANDESTINA', it.clandestina);
  y = biRow(doc, L, y, W, 'TABLERO', 'Tiene corriente', it.tableroCorriente);
  y = valueRow(doc, L, y, W, 'Lectura amperímetro', it.lectura?it.lectura+' mA':'—');

  y += 7;
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('OBSERVACIONES', L, y); y += 3;
  const obsLines = doc.splitTextToSize(it.obs||'—', W-6);
  const obsH = Math.max(20, obsLines.length*5+7);
  doc.setDrawColor(0); doc.rect(L,y,W,obsH,'S');
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text(obsLines, L+3, y+7);
  y += obsH+10;

  doc.rect(L,y,W/2,15,'S'); doc.rect(L+W/2,y,W/2,15,'S');
  doc.setFontSize(8);
  doc.text('Firma y aclaración del inspector', L+3, y+12);
  doc.text('Firma y aclaración del vecino/testigo', L+W/2+3, y+12);

  doc.setFontSize(7.5); doc.setTextColor(150);
  doc.text('Generado desde la app de Relevamiento de Bombas Depresoras · '+new Date().toLocaleDateString('es-AR'), L, 289);
  doc.setTextColor(0);
}
async function saveFile(filename, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function downloadPdfSingle(it){
  if(!it) return;
  if(!window.jspdf){ alert('La librería para generar PDF todavía está cargando, esperá unos segundos y probá de nuevo.'); return; }
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  drawBombaPage(doc, it);
  await saveFile(`bomba_${(it.numero||'sn').replace(/[^\w-]/g,'_')}.pdf`, doc.output('blob'));
}
async function downloadPdfList(list){
  if(!list.length){ alert('No hay bombas para exportar con estos filtros.'); return; }
  if(!window.jspdf){ alert('La librería para generar PDF todavía está cargando, esperá unos segundos y probá de nuevo.'); return; }
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  list.forEach((it,i)=>{ if(i>0) doc.addPage(); drawBombaPage(doc, it); });
  await saveFile(`planillas_bombas_${new Date().toISOString().slice(0,10)}.pdf`, doc.output('blob'));
}

function fieldSeg(f, current){
  return `<div class="field"><label>${f.label}</label><div class="seg" data-key="${f.k}">
    ${f.opts.map(([v,l])=>`<button type="button" class="${current===v?'on':''}" data-v="${v}">${l}</button>`).join('')}
  </div></div>`;
}

function openSheet(id){
  editingId=id;
  const it = id ? items.find(x=>x.id===id) : {numero:'',esta:'',funciona:'',medidor:'',corriente:'',clandestina:'',tableroCorriente:'',lectura:'',obs:''};
  const sheet=document.getElementById('sheet');
  sheet.innerHTML = `
    <h2>${id?'Editar bomba N° '+it.numero:'Nueva bomba'}</h2>
    <div class="field"><label>Número de bomba</label><input type="text" id="fNumero" value="${it.numero||''}" placeholder="Ej: 427"></div>
    ${FIELDS.map(f=>fieldSeg(f,it[f.k])).join('')}
    <div class="row2">
      <div class="field"><label>Lectura amperímetro (mA)</label><input type="text" id="fLectura" value="${it.lectura||''}" placeholder="Ej: 1.09"></div>
    </div>
    <div class="field"><label>Observaciones</label><textarea id="fObs" placeholder="Notas de campo...">${it.obs||''}</textarea></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="btnCancel">Cancelar</button>
      <button class="btn primary" id="btnSave">Guardar</button>
    </div>
    ${id?'<div class="sheet-actions"><button class="btn danger" id="btnDel">Eliminar bomba</button></div>':''}
  `;
  sheet.querySelectorAll('.seg').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
      seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===btn && !b.classList.contains('on')===false));
      const willTurnOn = !btn.classList.contains('on');
      seg.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
      if(willTurnOn) btn.classList.add('on');
    }));
  });
  document.getElementById('btnCancel').addEventListener('click',closeSheet);
  document.getElementById('btnSave').addEventListener('click',saveSheet);
  if(id) document.getElementById('btnDel').addEventListener('click', async ()=>{ await removeItem(id); closeSheet(); });
  document.getElementById('sheetBg').classList.add('show');
  sheet.classList.add('show');
}
function closeSheet(){ document.getElementById('sheetBg').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); editingId=null; }
async function saveSheet(){
  const sheet=document.getElementById('sheet');
  const obj={ numero: sheet.querySelector('#fNumero').value.trim(), lectura: sheet.querySelector('#fLectura').value.trim(), obs: sheet.querySelector('#fObs').value.trim() };
  FIELDS.forEach(f=>{
    const seg=sheet.querySelector(`.seg[data-key="${f.k}"]`);
    const on=seg.querySelector('button.on');
    obj[f.k]= on? on.dataset.v : '';
  });
  if(editingId) await updateItem(editingId, obj); else await addItem(obj);
  closeSheet();
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); tab=t.dataset.tab; render();
}));
document.getElementById('fab').addEventListener('click',()=>openSheet(null));
document.getElementById('sheetBg').addEventListener('click',closeSheet);

initStore();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW no registrado:', e)); });
}
</script>
